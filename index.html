<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La-Sobeh Delivery</title>
<meta name="theme-color" content="#c8102e">
<link rel="icon" href="la-sobeh-logo.png.jpg.jpg">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f5f5f7; color: #1a1a1a; min-height: 100vh; padding-bottom: 90px; }
  header { background: #fff; color: #1a1a1a; padding: 12px 16px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.08); display: flex; align-items: center; gap: 12px; }
  header img { height: 44px; width: auto; }
  header .brand h1 { font-size: 17px; font-weight: 700; color: #c8102e; }
  header .brand p { font-size: 11px; color: #777; margin-top: 1px; }
  .container { padding: 16px; max-width: 640px; margin: 0 auto; }
  .card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .card h2 { font-size: 17px; margin-bottom: 6px; }
  .card p { font-size: 14px; color: #555; line-height: 1.5; }
  .btn { display: block; width: 100%; background: #c8102e; color: #fff; border: none; padding: 14px; font-size: 16px; font-weight: 600; border-radius: 12px; cursor: pointer; margin-top: 10px; text-align: center; text-decoration: none; }
  .btn:active { background: #a00d24; }
  .btn-secondary { background: #fff; color: #c8102e; border: 2px solid #c8102e; }
  .btn-secondary:active { background: #ffe5e9; }
  .btn-small { padding: 10px; font-size: 14px; }
  .btn-green { background: #28a745; }
  .btn-green:active { background: #1e7e34; }
  .btn-red { background: #dc3545; }
  .btn-red:active { background: #a71d2a; }
  .big-option { background: #fff; border-radius: 14px; padding: 24px; margin-bottom: 12px; text-align: center; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .big-option:active { background: #fafafa; }
  .big-option .emoji { font-size: 44px; display: block; margin-bottom: 8px; }
  .big-option h3 { font-size: 20px; margin-bottom: 4px; }
  .big-option p { font-size: 13px; color: #777; }
  .input-group { margin-bottom: 14px; }
  .input-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #333; }
  .input-group input, .input-group textarea, .input-group select { width: 100%; padding: 12px; font-size: 15px; border: 1px solid #ddd; border-radius: 10px; background: #fff; font-family: inherit; }
  .input-group textarea { min-height: 80px; resize: vertical; }
  .search-bar { width: 100%; padding: 12px 14px; font-size: 15px; border: 1px solid #ddd; border-radius: 12px; background: #fff; margin-bottom: 10px; }
  .cat-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; -webkit-overflow-scrolling: touch; }
  .cat-bar button { flex: 0 0 auto; padding: 8px 16px; border-radius: 20px; border: 1px solid #ddd; background: #fff; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .cat-bar button.active { background: #c8102e; color: #fff; border-color: #c8102e; }
  .menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #eee; }
  .menu-item:last-child { border-bottom: none; }
  .menu-item .thumb { width: 68px; height: 68px; border-radius: 10px; object-fit: cover; background: #eee; flex-shrink: 0; }
  .menu-item .info { flex: 1; min-width: 0; }
  .menu-item .name { font-size: 15px; font-weight: 600; }
  .menu-item .price { font-size: 13px; color: #c8102e; font-weight: 600; margin-top: 2px; }
  .menu-item .from { font-size: 11px; color: #888; margin-top: 2px; }
  .add-btn { background: #c8102e; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .qty-control { display: flex; align-items: center; gap: 8px; }
  .qty-control button { width: 30px; height: 30px; border-radius: 50%; border: none; background: #c8102e; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
  .qty-control span { font-size: 14px; font-weight: 600; min-width: 18px; text-align: center; }
  .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a1a; color: #fff; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 -2px 10px rgba(0,0,0,.2); cursor: pointer; }
  .cart-bar .count { font-size: 13px; opacity: .85; }
  .cart-bar .total { font-size: 16px; font-weight: 700; }
  .pill { display: inline-block; padding: 4px 10px; font-size: 12px; font-weight: 600; border-radius: 20px; background: #e5e5ea; color: #333; }
  .pill.pending { background: #ffe5e9; color: #a00d24; }
  .pill.accepted { background: #d1ecf1; color: #0c5460; }
  .pill.preparing { background: #fff3cd; color: #856404; }
  .pill.ontheway { background: #cce5ff; color: #004085; }
  .pill.delivered { background: #d4edda; color: #155724; }
  .pill.rejected { background: #f8d7da; color: #721c24; }
  .small { font-size: 12px; color: #888; }
  .zone-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .zone-grid button { padding: 12px 8px; font-size: 13px; font-weight: 600; border: 1px solid #ddd; background: #fff; border-radius: 10px; cursor: pointer; }
  .zone-grid button.selected { background: #c8102e; color: #fff; border-color: #c8102e; }
  .payment-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
  .payment-grid button { padding: 14px 8px; font-size: 13px; font-weight: 600; border: 2px solid #ddd; background: #fff; border-radius: 12px; cursor: pointer; }
  .payment-grid button.selected { border-color: #c8102e; background: #ffe5e9; color: #c8102e; }
  .order-line { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
  .order-total { display: flex; justify-content: space-between; padding-top: 10px; margin-top: 10px; border-top: 2px solid #eee; font-weight: 700; font-size: 16px; }
  .success-icon { font-size: 60px; text-align: center; display: block; margin: 10px 0; }
  .center { text-align: center; }
  .order-card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06); cursor: pointer; }
  .order-card.pending-highlight { border-left: 5px solid #c8102e; background: #fff8f9; }
  .order-card.driver-highlight { border-left: 5px solid #28a745; background: #f4faf5; }
  .order-card .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .order-card .id { font-size: 13px; font-weight: 700; color: #c8102e; }
  .order-card .name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .order-card .meta { font-size: 12px; color: #777; }
  .resto-row { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
  .resto-logo { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; background: #eee; flex-shrink: 0; }
  .login-logo { display: block; max-width: 180px; margin: 0 auto 14px; }
  .loading { text-align: center; padding: 40px; color: #888; }
  .wallet-badge { display: inline-block; background: #d4edda; color: #155724; font-weight: 700; padding: 6px 12px; border-radius: 20px; font-size: 13px; }
  .token-badge { display: inline-block; background: #fff3cd; color: #856404; font-weight: 700; padding: 6px 12px; border-radius: 20px; font-size: 13px; }
  .photo-preview { width: 100%; max-height: 220px; object-fit: contain; border-radius: 10px; margin-top: 8px; background: #f5f5f5; }
</style>
</head>
<body>
<header>
  <img src="la-sobeh-logo.png.jpg.jpg" alt="La-Sobeh" onerror="this.style.display='none'">

<div id="app" class="container"><div class="loading">Loading…</div></div>

<script type="module">

const firebaseConfig = {

const ADMIN_PIN = "3397";
const WHISH_NUMBER = "71180336";
const WHATSAPP_NUMBER = "71180336";

const ZONES = [
  { name:"Zahle",     feeLL:200000, feeUSD:3 },
  { name:"Chtoura",   feeLL:350000, feeUSD:4 },
  { name:"Saadnayel", feeLL:350000, feeUSD:4 },

  { name:"Ferzoul",   feeLL:350000, feeUSD:4 },
  { name:"Ablah",     feeLL:350000, feeUSD:4 },

const CATEGORIES = ["All","Burgers","Sandwiches","Grills","Combos","Juices","Soft Drinks","Grocery","Packages","Errands"];

const RESTAURANTS = [
  { id:"efendim", name:"Efendim Restaurant", cuisine:"Turkish", location:"Zahle", logo:"efendim.png.jpg",
    menu:[
      { id:"ef1", name:"Tawouk Sandwich", priceLL:700000, priceUSD:8, img:"efendim-tawouk.png.jpg.JPG", cat:"Sandwiches" },
      { id:"ef2", name:"Chicken Efendim", priceLL:1200000, priceUSD:14, img:"efendim-chicken.png.jpg.JPG", cat:"Grills" }
    ]},
  { id:"grillgo", name:"Grill & Go Restaurant", cuisine:"Fast Food", location:"Zahle", logo:"grillgo.png.jpg",
    menu:[
      { id:"gg1", name:"Zinger Combo", priceLL:800000, priceUSD:9, img:"grillgo-zinger.png.jpg.JPG", cat:"Combos" },
      { id:"gg2", name:"Cranch Boss", priceLL:600000, priceUSD:7, img:"grillgo-cranch.png.jpg.JPG", cat:"Burgers" }
    ]},
  { id:"beitmisk", name:"Beit Misk Restaurant", cuisine:"Lebanese Grill", location:"Zahle", logo:"beitmisk.png.jpg",
    menu:[
      { id:"bm1", name:"Kabab Plate", priceLL:700000, priceUSD:8, img:"beitmisk-kabab.png.jpg.WEBP", cat:"Grills" },
      { id:"bm2", name:"Mandi Chicken", priceLL:1200000, priceUSD:14, img:"beitmisk-mandi.png.jpg.AVIF", cat:"Grills" }
    ]}
];

const GROCERY = {
  id:"grocery", name:"La-Sobeh Grocery", cuisine:"Grocery", location:"Zahle", logo:"",
  menu:[
    { id:"g1", name:"Red Bull", priceLL:500000, priceUSD:6, img:"grocery-redbull.png.jpg.WEBP", cat:"Soft Drinks" },
    { id:"g2", name:"Pepsi", priceLL:100000, priceUSD:2, img:"grocery-pepsi.png.jpg.WEBP", cat:"Soft Drinks" }
  ]
};

let state = {
  screen:"login", role:"customer", user:null, driver:null,
  category:null, vendor:null, cart:[], zone:null, payment:null, currency:"LL",
  search:"", activeCat:"All", currentOrder:null,
  wallet:{ balance:0, tokens:0 },
  deliveryType:"food", packageInfo:null,
  adminOrders:[], driversCache:[]
};

const LSK = { session:"lasobeh_session_v5" };
function setSession(s){ s?localStorage.setItem(LSK.session,JSON.stringify(s)):localStorage.removeItem(LSK.session) }
function getSession(){ try{return JSON.parse(localStorage.getItem(LSK.session))}catch(e){return null} }
function money(n, cur){ return cur==="USD" ? "$"+n : n.toLocaleString()+" L.L"; }
function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])) }
function cartCount(){ return state.cart.reduce((s,i)=>s+i.qty,0) }
function cartTotal(){ return state.cart.reduce((s,i)=>s+(state.currency==="USD"?i.priceUSD:i.priceLL)*i.qty,0) }
function zoneFee(){ const z=ZONES.find(z=>z.name===state.zone); if(!z) return 0; return state.currency==="USD"?z.feeUSD:z.feeLL }
function phoneKey(p){ return p.replace(/[^0-9]/g,"") }
function statusLabel(s){
  return s==="pending"?"Pending approval":s==="accepted"?"Accepted":s==="preparing"?"Preparing":
         s==="ontheway"?"On the way":s==="delivered"?"Delivered":s==="rejected"?"Rejected":s;
}

async function loadWallet(){
  if(!state.user) return;
  try{
    const snap=await getDoc(doc(db,"customers",state.user.key));
    if(snap.exists()){ const d=snap.data(); state.wallet={ balance:d.balance||0, tokens:d.tokens||0 }; }
    else state.wallet={ balance:0, tokens:0 };
  }catch(e){ console.warn(e) }
}

function render(){
  const app=document.getElementById("app"); app.innerHTML="";
  const s=state.screen;
  const V={
    login:viewLogin, home:viewHome, search:viewSearch, foodList:viewFoodList, vendor:viewVendor,
    checkout:viewCheckout, confirm:viewConfirm, track:viewTrack, myOrders:viewMyOrders,
    wallet:viewWallet, topup:viewTopUp, package:viewPackage,
    adminLogin:viewAdminLogin, admin:viewAdmin, adminOrder:viewAdminOrder,
    adminWallet:viewAdminWallet, adminStats:viewAdminStats, adminDrivers:viewAdminDrivers,
    driverLogin:viewDriverLogin, driverHome:viewDriverHome, driverOrder:viewDriverOrder
  };
  if(V[s]) app.appendChild(V[s]()); else app.appendChild(el(`<div class="card center"><p>Unknown screen: ${esc(s)}</p></div>`));
  window.scrollTo(0,0);
}

function viewLogin(){
  const w=el(`<div>
    <img class="login-logo" src="la-sobeh-logo.png.jpg.jpg" alt="La-Sobeh" onerror="this.style.display='none'">
    <div class="card"><h2>Welcome 👋</h2><p>Login with your name and phone number to place an order.</p></div>
    <div class="card">
      <div class="input-group"><label>Phone Number</label><input id="lp" type="tel" placeholder="70 123 456"></div>
      <div class="input-group"><label>Full Name</label><input id="ln" type="text" placeholder="Your name"></div>
      <button class="btn" id="lb">Login / Register</button>
    </div>
    <button class="btn btn-secondary btn-small" id="dl">🚗 Driver login →</button>
    <button class="btn btn-secondary btn-small" id="al">🔐 Admin login →</button>
  </div>`);
  const lp=w.querySelector("#lp");
  lp.onblur=async ()=>{
    const key=phoneKey(lp.value.trim()); if(key.length<7) return;
    try{ const snap=await getDoc(doc(db,"customers",key)); if(snap.exists()){ const d=snap.data(); if(d.name) w.querySelector("#ln").value=d.name; } }catch(e){}
  };
  w.querySelector("#lb").onclick=async ()=>{
    const p=lp.value.trim(), n=w.querySelector("#ln").value.trim();
    if(!p || p.replace(/[^0-9]/g,"").length<7){alert("Please enter a valid phone number.");return}
    if(!n){alert("Please enter your name.");return}
    const key=phoneKey(p);
    try{
      const ref=doc(db,"customers",key), snap=await getDoc(ref);
      if(!snap.exists()) await setDoc(ref, { name:n, phone:p, phoneKey:key, balance:0, tokens:0, createdAt:serverTimestamp() });
      else await updateDoc(ref, { name:n, phone:p, updatedAt:serverTimestamp() });
    }catch(e){ console.warn(e) }
    state.role="customer";
    state.user={ name:n, phone:p, key:key };
    setSession({ role:"customer", user:state.user });
    await loadWallet();
    state.screen="home"; render();
  };
  w.querySelector("#al").onclick=()=>{ state.screen="adminLogin"; render() };
  w.querySelector("#dl").onclick=()=>{ state.screen="driverLogin"; render() };
  return w;
}

function viewHome(){
  const walletLine = `<div class="card"><div style="display:flex;gap:10px;flex-wrap:wrap;">
      <span class="wallet-badge">💵 Wallet: $${state.wallet.balance.toFixed(2)}</span>
      <span class="token-badge">🎁 ${state.wallet.tokens} LS Tokens</span>
    </div></div>`;
  const w=el(`<div>
    <div class="card"><h2>Hi ${esc(state.user.name)} 👋</h2><p>What would you like today?</p></div>
    ${walletLine}
    <input class="search-bar" id="sq" placeholder="🔍 Search for an item…" value="${esc(state.search)}">
    <div class="big-option" id="fo"><span class="emoji">🍽️</span><h3>Food</h3><p>Restaurants · Snacks · Pubs</p></div>
    <div class="big-option" id="go"><span class="emoji">🛒</span><h3>Grocery</h3><p>From La-Sobeh Grocery</p></div>
    <div class="big-option" id="po"><span class="emoji">📦</span><h3>Send a Package</h3><p>Deliver from A → B, with photo</p></div>
    <div class="big-option" id="bo"><span class="emoji">🏪</span><h3>Bring me something</h3><p>From any store, we pick it up</p></div>
    <button class="btn btn-secondary btn-small" id="wo">💵 My Wallet & Tokens</button>
    <button class="btn btn-secondary btn-small" id="mo">📦 My Orders</button>
    <button class="btn btn-secondary btn-small" id="lo">Logout</button>
  </div>`);
  w.querySelector("#sq").oninput=(e)=>{ state.search=e.target.value; if(e.target.value.length>=2){ state.screen="search"; render() } };
  w.querySelector("#fo").onclick=()=>{ state.deliveryType="food"; state.category="food"; state.screen="foodList"; render() };
  w.querySelector("#go").onclick=()=>{ state.deliveryType="food"; state.category="grocery"; state.vendor=GROCERY; state.cart=[]; state.screen="vendor"; render() };
  w.querySelector("#po").onclick=()=>{ state.deliveryType="package"; state.packageInfo={mode:"send"}; state.screen="package"; render() };
  w.querySelector("#bo").onclick=()=>{ state.deliveryType="package"; state.packageInfo={mode:"bring"}; state.screen="package"; render() };
  w.querySelector("#wo").onclick=()=>{ state.screen="wallet"; render() };
  w.querySelector("#mo").onclick=()=>{ state.screen="myOrders"; render() };
  w.querySelector("#lo").onclick=()=>{ state.user=null; setSession(null); state.screen="login"; render() };
  return w;
}

function allItems(){
  const out=[];
  RESTAURANTS.forEach(r=>r.menu.forEach(item=>out.push({ ...item, vendor:r.name, vendorId:r.id, isGrocery:false })));
  GROCERY.menu.forEach(item=>out.push({ ...item, vendor:GROCERY.name, vendorId:GROCERY.id, isGrocery:true }));
  return out;
}

function viewSearch(){
  const w=el(`<div>
    <button class="btn btn-secondary btn-small" id="b" style="margin-bottom:12px;">← Back</button>
    <input class="search-bar" id="sq" placeholder="🔍 Search for an item…" value="${esc(state.search)}">
    <div id="res"></div>
  </div>`);
  const sq=w.querySelector("#sq"); sq.focus();
  const paint=()=>{
    const q=state.search.toLowerCase().trim();
    const box=w.querySelector("#res"); box.innerHTML="";
    if(q.length<1){ box.appendChild(el(`<div class="card center"><p>Type to search…</p></div>`)); return }
    const results=allItems().filter(i=>i.name.toLowerCase().includes(q));
    if(!results.length){ box.appendChild(el(`<div class="card center"><p>No matches.</p></div>`)); return }
    results.forEach(item=>{
      const imgTag=item.img?`<img class="thumb" src="${item.img}" onerror="this.style.display='none'">`:`<div class="thumb" style="display:flex;align-items:center;justify-content:center;font-size:30px;">🍽️</div>`;
      const row=el(`<div class="menu-item">${imgTag}
        <div class="info"><div class="name">${esc(item.name)}</div>
          <div class="price">${money(item.priceLL,"LL")} · ${money(item.priceUSD,"USD")}</div>
          <div class="from">from ${esc(item.vendor)}</div></div>
        <button class="add-btn">+ Add</button></div>`);
      row.querySelector("button").onclick=()=>{
        const existing=state.cart.find(c=>c.id===item.id);
        if(existing) existing.qty++; else state.cart.push({ id:item.id, name:item.name, priceLL:item.priceLL, priceUSD:item.priceUSD, qty:1 });
        renderCartBar(); alert("Added: "+item.name);
      };
      box.appendChild(row);
    });
  };
  sq.oninput=(e)=>{ state.search=e.target.value; paint() };
  paint();
  w.querySelector("#b").onclick=()=>{ state.search=""; state.screen="home"; render() };
  return w;
}

function viewFoodList(){
  const w=el(`<div>
    <button class="btn btn-secondary btn-small" id="b" style="margin-bottom:12px;">← Back</button>
    <div class="cat-bar" id="catbar"></div>
    <div class="card"><h2>Choose a restaurant</h2></div>
    <div id="list"></div>
  </div>`);
  const catbar=w.querySelector("#catbar");
  CATEGORIES.forEach(c=>{
    const btn=el(`<button>${c}</button>`);
    if(state.activeCat===c) btn.classList.add("active");
    btn.onclick=()=>{ state.activeCat=c; render() };
    catbar.appendChild(btn);
  });
  const list=w.querySelector("#list");
  const filtered=RESTAURANTS.filter(r=>state.activeCat==="All" || r.menu.some(m=>m.cat===state.activeCat));
  filtered.forEach(r=>{
    const items = state.activeCat==="All" ? r.menu : r.menu.filter(m=>m.cat===state.activeCat);
    const c=el(`<div class="card">
      <div class="resto-row">
        <img class="resto-logo" src="${r.logo}" onerror="this.style.display='none'">
        <div style="flex:1;"><h2>${esc(r.name)}</h2><p>${esc(r.cuisine)} · 📍 ${esc(r.location)}</p></div>
      </div>
      <div class="small" style="margin-top:4px;">${items.length} item(s) in ${state.activeCat}</div>
      <button class="btn btn-small" style="margin-top:10px;">View Menu</button>
    </div>`);
    c.querySelector("button").onclick=()=>{ state.vendor=r; state.cart=[]; state.screen="vendor"; render() };
    list.appendChild(c);
  });
  if(!filtered.length) list.appendChild(el(`<div class="card center"><p>No restaurants in this category.</p></div>`));
  w.querySelector("#b").onclick=()=>{ state.screen="home"; state.activeCat="All"; render() };
  return w;
}

function viewVendor(){
  const v=state.vendor;
  const w=el(`<div>

function paintQty(item, holder){
  holder.innerHTML="";
  const inCart = state.cart.find(c=>c.id===item.id);
  if(!inCart){
    const btn=el(`<button class="add-btn">+ Add</button>`);
    btn.onclick=()=>{ state.cart.push({ id:item.id, name:item.name, priceLL:item.priceLL, priceUSD:item.priceUSD, qty:1 }); paintQty(item,holder); renderCartBar() };
    holder.appendChild(btn);
  } else {
    const ctrl=el(`<div class="qty-control"><button>-</button><span>${inCart.qty}</span><button>+</button></div>`);
    const [minus,plus]=ctrl.querySelectorAll("button");
    minus.onclick=()=>{ inCart.qty--; if(inCart.qty<=0) state.cart=state.cart.filter(c=>c.id!==item.id); paintQty(item,holder); renderCartBar() };
    plus.onclick=()=>{ inCart.qty++; paintQty(item,holder); renderCartBar() };
    holder.appendChild(ctrl);
  }
}

function renderCartBar(){
  const old=document.getElementById("cartbar"); if(old) old.remove();
  if(cartCount()===0) return;
  const bar=el(`<div class="cart-bar" id="cartbar"><div><div class="count">${cartCount()} item(s)</div><div class="total">${money(cartTotal(), state.currency)}</div></div><div>Checkout →</div></div>`);
  bar.onclick=()=>{ state.screen="checkout"; render() };
  document.body.appendChild(bar);
}

  });

  const zg=w.querySelector("#zg");

    const btn=el(`<button>${z.name}</button>`);

    zg.appendChild(btn);
  });

  function recalc(){
    const st=cartTotal(), f=zoneFee();
    const fd=w.querySelector("#freeDel");
    const freeDel = fd && fd.checked;
    const t = st + (freeDel?0:f);
    w.querySelector("#fee").textContent = state.zone ? (freeDel?"FREE":money(f,state.currency)) : "—";
    w.querySelector("#grand").textContent = money(t, state.currency);
  }
  const fd=w.querySelector("#freeDel"); if(fd) fd.onchange=recalc;

  w.querySelector("#cg").querySelectorAll("button").forEach(btn=>{
    btn.onclick=()=>{ state.currency=btn.dataset.c; render() };
  });
  w.querySelector("#pg").querySelectorAll("button").forEach(btn=>{
    btn.onclick=()=>{
      if(btn.dataset.p==="wallet" && state.wallet.balance<1){ alert("Your wallet is empty. Please top up first."); return }
      state.payment=btn.dataset.p;
      w.querySelector("#pg").querySelectorAll("button").forEach(b=>b.classList.remove("selected"));
      btn.classList.add("selected");
    };
  });
  w.querySelector("#b").onclick=()=>{ state.screen="home"; render() };

    if(!state.payment){alert("Please choose payment.");return}

    w.querySelector("#place").textContent="Placing order…"; w.querySelector("#place").disabled=true;

    const freeDel = w.querySelector("#freeDel") && w.querySelector("#freeDel").checked;
    const st=cartTotal(), f=zoneFee();
    const total= st + (freeDel?0:f);

    const orderData={
      userKey:state.user.key, name:n, phone:p, address:a,
      zone:state.zone, payment:state.payment,
      vendor:state.vendor ? state.vendor.name : "Package",
      type:"food",
      items: state.cart.map(c=>({ id:c.id, name:c.name, qty:c.qty, price: state.currency==="USD"?c.priceUSD:c.priceLL })),
      currency:state.currency,
      subtotal:st, deliveryFee:freeDel?0:f, deliveryFeeRaw:f, freeDelivery:freeDel,
      total:total,
      status:"pending",
      driverId:null, driverName:null, driverPhone:null,
      createdAt:serverTimestamp()
    };

    try{
      const ref=await addDoc(collection(db,"orders"), orderData);
      if(state.payment==="wallet"){
        const newBalance = state.wallet.balance - total;
        if(newBalance<0){ alert("Wallet insufficient."); w.querySelector("#place").textContent="Place Order"; w.querySelector("#place").disabled=false; return }
        await updateDoc(doc(db,"customers",state.user.key), { balance:newBalance });
      }
      let newTokens = state.wallet.tokens;
      if(freeDel) newTokens = newTokens - 20;
      const totalUSD = state.currency==="USD" ? total : total/USD_RATE;
      if(totalUSD>=100) newTokens = newTokens + 20;
      if(newTokens!==state.wallet.tokens) await updateDoc(doc(db,"customers",state.user.key), { tokens:newTokens });
      await loadWallet();

      const order={ ...orderData, id:"LS-"+ref.id.slice(-6).toUpperCase(), docId:ref.id, createdAt:new Date().toISOString() };
      state.currentOrder=order; state.cart=[];
      const cb=document.getElementById("cartbar"); if(cb) cb.remove();
      state.screen="confirm"; render();
    }catch(e){
      alert("Failed: "+e.message);
      w.querySelector("#place").textContent="Place Order"; w.querySelector("#place").disabled=false;
    }
  };
  return w;
}

    const p=w.querySelector("#dp").value.trim(), c=w.querySelector("#dc").value.trim();
    if(!p||!c){alert("Enter phone and PIN.");return}
    const key=phoneKey(p);
    try{
      const snap=await getDoc(doc(db,"drivers",key));
      if(!snap.exists()){ alert("Driver not found."); return }
      const d=snap.data();
      if(d.pin!==c){ alert("Wrong PIN."); return }
      if(d.active===false){ alert("Account disabled."); return }
      state.role="driver";
      state.driver={ key, name:d.name, phone:d.phone, pin:d.pin };
      setSession({ role:"driver", driver:state.driver });
      state.screen="driverHome"; render();
    }catch(e){ alert("Error: "+e.message) }
  };
  return w;
}

function viewDriverHome(){
  const w=el(`<div>
    <div class="card"><h2>Hi ${esc(state.driver.name)} 🚗</h2>
      <p>You are logged in as a driver.</p>
    </div>

    <div id="list"><div class="loading">Loading…</div></div>
  </div>`);
  const list=w.querySelector("#list");
  w.querySelector("#lo").onclick=()=>{ state.driver=null; state.role="customer"; setSession(null); state.screen="login"; render() };
  try{
    const q=query(collection(db,"orders"), where("driverId","==",state.driver.key));
    const unsub=onSnapshot(q, (snap)=>{
      list.innerHTML="";
      if(snap.empty){ list.appendChild(el(`<div class="card center"><p>No orders assigned to you.</p></div>`)); return }
      const arr=snap.docs.map(d=>({ ...d.data(), docId:d.id, id:"LS-"+d.id.slice(-6).toUpperCase() }));
      arr.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
      arr.forEach(o=>{
        const cls = (o.status==="accepted" || o.status==="preparing" || o.status==="ontheway") ? "order-card driver-highlight" : "order-card";

  }catch(e){ list.innerHTML=""; list.appendChild(el(`<div class="card center"><p>Error: ${esc(e.message)}</p></div>`)) }
  return w;
}

}

function viewAdminDrivers(){
  const w=el(`<div>
    <button class="btn btn-secondary btn-small" id="b" style="margin-bottom:12px;">← Back</button>
    <div class="card"><h2>🚗 Drivers</h2>
      <div class="input-group"><label>Name</label><input id="dn" placeholder="e.g. Mizo"></div>
      <div class="input-group"><label>Phone</label><input id="dp" type="tel" placeholder="03 033 331"></div>
      <div class="input-group"><label>PIN (4 digits)</label><input id="dc" type="tel" maxlength="6" placeholder="1111"></div>
      <button class="btn btn-small" id="add">Add / Update Driver</button>
    </div>
    <div id="list"><div class="loading">Loading…</div></div>
  </div>`);
  w.querySelector("#b").onclick=()=>{ state.screen="admin"; render() };
  const list=w.querySelector("#list");
  const paint=async ()=>{
    const drivers=await loadDrivers();
    list.innerHTML="";
    if(!drivers.length){ list.appendChild(el(`<div class="card center"><p>No drivers yet.</p></div>`)); return }
    drivers.forEach(d=>{
      const c=el(`<div class="card"><p><b>${esc(d.name)}</b> — ${esc(d.phone)}</p>
        <p class="small">PIN: ${esc(d.pin||"?")} · ${d.active===false?"DISABLED":"active"}</p>
        <div style="display:flex;gap:8px;margin-top:8px;">
          <button class="btn btn-small btn-secondary" style="flex:1;" data-t="toggle">${d.active===false?"Enable":"Disable"}</button>
          <button class="btn btn-small btn-red" style="flex:1;" data-t="del">Delete</button>
        </div></div>`);
      c.querySelector('[data-t="toggle"]').onclick=async ()=>{ await updateDoc(doc(db,"drivers",d.key), { active: d.active===false }); paint() };
      c.querySelector('[data-t="del"]').onclick=async ()=>{ if(!confirm("Delete driver "+d.name+"?")) return; await deleteDoc(doc(db,"drivers",d.key)); paint() };
      list.appendChild(c);
    });
  };
  w.querySelector("#add").onclick=async ()=>{
    const n=w.querySelector("#dn").value.trim(), p=w.querySelector("#dp").value.trim(), c=w.querySelector("#dc").value.trim();
    if(!n||!p||!c){alert("Fill all fields.");return}
    if(c.length<4){alert("PIN must be at least 4 digits.");return}
    const key=phoneKey(p);
    await setDoc(doc(db,"drivers",key), { name:n, phone:p, pin:c, active:true, createdAt:serverTimestamp() });
    alert("Driver saved.");
    w.querySelector("#dn").value=""; w.querySelector("#dp").value=""; w.querySelector("#dc").value="";
    paint();
  };
  paint();
  return w;
}

function viewAdminWallet(){
  const w=el(`<div>
    <button class="btn btn-secondary btn-small" id="b" style="margin-bottom:12px;">← Back</button>
    <div class="card"><h2>💰 Credit Customer</h2>
      <div class="input-group"><label>Phone</label><input id="cp" type="tel"></div>
      <button class="btn btn-secondary btn-small" id="look">Look Up</button>
      <div id="found"></div>
    </div>
    <div id="pending"></div>
  </div>`);
  w.querySelector("#b").onclick=()=>{ state.screen="admin"; render() };
  const found=w.querySelector("#found");
  w.querySelector("#look").onclick=async ()=>{
    const key=phoneKey(w.querySelector("#cp").value);
    if(!key) return;
    found.innerHTML="<p class='small'>Searching…</p>";
    const snap=await getDoc(doc(db,"customers",key));
    if(!snap.exists()){ found.innerHTML="<p class='small'>Not found.</p>"; return }
    const d=snap.data();
    found.innerHTML=`<div class="card"><p><b>${esc(d.name)}</b></p>
      <p class="small">Balance: $${(d.balance||0).toFixed(2)} · Tokens: ${d.tokens||0}</p>
      <div class="input-group" style="margin-top:10px;"><label>Add (USD)</label><input id="amt" type="number" min="1" step="1"></div>
      <div class="input-group"><label>Add tokens</label><input id="tk" type="number" min="0" step="1" value="0"></div>
      <button class="btn" id="credit">Credit</button></div>`;
    found.querySelector("#credit").onclick=async ()=>{
      const amt=parseFloat(found.querySelector("#amt").value)||0;
      const tk=parseInt(found.querySelector("#tk").value)||0;
      const cur=await getDoc(doc(db,"customers",key)), cd=cur.data();
      await updateDoc(doc(db,"customers",key), { balance:(cd.balance||0)+amt, tokens:(cd.tokens||0)+tk });
      alert("Credited."); w.querySelector("#look").click();
    };
  };
  (async ()=>{
    const box=w.querySelector("#pending");
    box.innerHTML="<h2 style='margin:12px 0 6px;font-size:15px;'>Pending Top-Ups</h2><div class='loading'>Loading…</div>";
    const snap=await getDocs(query(collection(db,"topups"), where("status","==","pending")));
    box.innerHTML="<h2 style='margin:12px 0 6px;font-size:15px;'>Pending Top-Ups</h2>";
    if(snap.empty){ box.appendChild(el(`<p class='small'>None.</p>`)); return }
    snap.forEach(d=>{
      const t=d.data();
      const card=el(`<div class="card"><p><b>${esc(t.name)}</b> — ${esc(t.phone)}</p>
        <p class="small">$${t.amount} · ${t.method}</p>
        <button class="btn btn-small btn-green" style="margin-top:8px;">✓ Credit & Mark Done</button></div>`);
      card.querySelector("button").onclick=async ()=>{
        const key=phoneKey(t.phone);
        const cur=await getDoc(doc(db,"customers",key));
        if(cur.exists()){ const cd=cur.data(); await updateDoc(doc(db,"customers",key), { balance:(cd.balance||0)+t.amount }) }
        await updateDoc(doc(db,"topups",d.id), { status:"done" });
        alert("Credited $"+t.amount); state.screen="adminWallet"; render();
      };
      box.appendChild(card);
    });
  })();
  return w;
}

function viewAdminStats(){
  const w=el(`<div>
    <button class="btn btn-secondary btn-small" id="b" style="margin-bottom:12px;">← Back</button>
    <div class="card"><h2>📊 Totals</h2><div id="stats"><div class="loading">Loading…</div></div></div>
  </div>`);
  w.querySelector("#b").onclick=()=>{ state.screen="admin"; render() };
  (async ()=>{
    const box=w.querySelector("#stats");
    const snap=await getDocs(collection(db,"orders"));
    let today=0, week=0, all=0, count=0;
    const now=Date.now();
    snap.forEach(d=>{
      const o=d.data(); count++;
      const totalUSD = o.currency==="USD" ? o.total : (o.total/USD_RATE);
      const t = o.createdAt?.seconds ? o.createdAt.seconds*1000 : 0;
      all += totalUSD;
      if(now-t < 7*24*3600*1000) week+=totalUSD;
      if(now-t < 24*3600*1000) today+=totalUSD;
    });
    box.innerHTML=`<p style="font-size:22px;font-weight:700;margin-top:8px;">Today: $${today.toFixed(2)}</p>
      <p style="font-size:18px;font-weight:700;margin-top:8px;">This week: $${week.toFixed(2)}</p>
      <p style="font-size:18px;font-weight:700;margin-top:8px;">All time: $${all.toFixed(2)}</p>
      <p class="small" style="margin-top:8px;">${count} order(s). L.L. equiv: ${(all*USD_RATE).toLocaleString()}</p>`;
  })();
  return w;
}

(async function init(){
  const s=getSession();
  if(s && s.role==="admin"){ state.role="admin"; state.screen="admin" }
  else if(s && s.role==="driver" && s.driver){ state.role="driver"; state.driver=s.driver; state.screen="driverHome" }
  else if(s && s.role==="customer" && s.user){ state.role="customer"; state.user=s.user; await loadWallet(); state.screen="home" }
  else { state.screen="login" }
  render();
})();
</script>
